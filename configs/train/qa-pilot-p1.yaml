# P1 (coherence_embedding) on the HotpotQA/MuSiQue retrieval corpus, 32x512, real Ling codec.
# Paths are the CoreWeave sandbox layout of configs/cloud/qa-p1.json.
phase: P1
model: 32x512
codec: /work/inputs/codec
dataset: /work/out/corpus/datasets/rc-train/data
output: /work/out/p1
device: cuda
precision: bf16
expert_backend: auto
gradient_checkpointing: true
retrieval_memory_recipe: /work/out/corpus/recipes/coherence_embedding.json
retrieval_sidecar: /work/out/corpus/datasets/rc-train/queries.jsonl
retrieval_document_sidecar: /work/out/corpus/datasets/rc-train/documents.jsonl
microbatch_episodes: 4
accumulate_scored: 4096
max_accumulation_windows: 8
max_history_tokens: 4096
generated_capacity: 128
max_steps: 3000
budget: 1000000000
checkpoint_every: 250
keep_checkpoints: 2
eval_every: 0
log_every: 10
effort: 1
