# Accepted student-state corrections plus successful replay. Corrected actions
# need fresh dependent observations, enforced by data acceptance contracts.
phase: D
model: v13
dataset: artifacts/prepared
codec: artifacts/codec
output: runs/d
device: cuda
precision: bf16
require_blackwell: true
expert_backend: torch
recurrent_backend: torch
gradient_checkpointing: true
compile: false
microbatch_episodes: 4
max_history_tokens: 65536
max_window_records: 16
max_record_bytes: 16384
generated_capacity: 4096
scored_decisions: 2
accumulate_scored: 65536
accumulate_ingested: 1048576
max_accumulation_windows: 256
use_stage_mixture: true
use_effort_mixture: true
prior_probability: 0.5
repair_fraction: 0.1
checkpoint_every: 100
eval_every: 100
