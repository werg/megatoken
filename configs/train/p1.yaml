# Broad pretraining, resumed from B0 with --phase-transition.
# This is the initial 8K window profile. Raise it only after memory/quality gates.
# Phase recipes own token budgets, stream proportions, and effort probabilities.
phase: P1
model: recurrent32
dataset: artifacts/prepared
codec: artifacts/codec
output: runs/p1
device: cuda
precision: bf16
require_blackwell: true
expert_backend: torch
representation_mode: recurrent
gradient_checkpointing: true
compile: false
microbatch_episodes: 8
max_history_tokens: 8192
max_window_records: 8
max_record_bytes: 16384
generated_capacity: 1024
scored_decisions: 4
accumulate_scored: 65536
accumulate_ingested: 1048576
max_accumulation_windows: 256
use_stage_mixture: true
use_effort_mixture: true
checkpoint_every: 100
eval_every: 100
