# Target methodology: DiLoCo decoupled learners for base pretraining (P1).
# Neural parameters synchronize through the coordinator as fragments; the
# transducer bank's sparse rows are merged there in 32-step rounds.
# All PIN_* artifact identities must be filled in after original data preparation.
phase: P1
output: /work/runs/diloco-p1
model: 32x512
# This example includes media streams, so it also needs the locked realizer pack
# manifest used by those streams. Deliver the matching pack assets to every role.
packs: /work/assets/packs/lock.json
# Explicit import of both selected native n-gram donors. The small descriptor
# assets are created from real corpus contexts by the cloud preparation recipe
# configs/cloud/prepare-engram-donors.example.json and delivered to every role
# through verified assets.inputs. This is an approximate translation into
# Megatoken byte-hash rows; donor row numbers are never copied directly.
engram_imports:
  - /work/assets/deepseek-v4.1-flash-1017
  - /work/assets/qwen3.8-flash-next
# One root per preparation script; every stage stream is read from whichever
# roots contain it, and each episode's media from its own root.
datasets:
  - PIN_PREPARED_TEXT_AND_CODE_ROOT
  - PIN_PREPARED_MEDIA_IDENTITY_ROOT
  - PIN_PREPARED_MEDIA_TASKS_ROOT
  - PIN_PREPARED_LONG_DOCUMENT_READING_ROOT
codec: PIN_RAW_CODEC_DIRECTORY
device: cuda
precision: bf16
require_blackwell: true
expert_backend: triton
representation_mode: recurrent
# P1 is metered in new tokens (D) and defaults to its full 400B limit; a
# smaller budget (in D tokens) shortens the run and its learning-rate schedule.
microbatch_episodes: 1
max_accumulation_windows: 64
max_history_tokens: 4096
max_window_records: 16
max_record_bytes: 16384
generated_capacity: 512
scored_decisions: 4
effort: 6
# Worker 0 scores 16 held-out windows of each stage stream every 256 local steps.
eval_every: 256
eval_windows: 16
checkpoint_every: 100
router_balance_mode: global
gradient_checkpointing: true
compile: false
use_stage_mixture: true
use_effort_mixture: false

# Each of 8 CoreWeave GPU sandboxes executes one independent learner.
# MEGATOKEN_WORKER_ID (0..7) comes from the sandbox launcher.
inner_optimizer: muon
decoupled:
  run_id: PIN_RUN_ID
  coordinator_url: https://REPLACE-WITH-COORDINATOR-HOST
  workers: 8
  local_steps: 256
  io_workers: 4
  timeout_seconds: 120
  max_offline_steps: 2048
  wire_dtype: bf16
  # Strongly recommended: CoreWeave AI Object Storage / compatible S3.
  # checkpoint_s3: s3://YOUR-BUCKET/megatoken-checkpoints
