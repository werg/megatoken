# Media phase 2 of 3 (configs/tasks/media-joint.yaml). Start a new coordinator
# from the media-bridge coordinator export (see media-bridge.example.yaml).
# Everything trains; owners frozen in the bridge phase start from their
# exported weights with fresh inner-optimizer moments.
# Prepare media with scripts/prepare_media.py, identity episodes (plus the
# "text" stream via --text-episodes) with scripts/prepare_media_identity.py,
# and text anchors with scripts/prepare_media.py --anchors. Replace every PIN_*.
phase: P1
model: 32x512
codec: PIN_TRAINED_BYTE_CODEC
dataset: PIN_PREPARED_TEXT_AND_MEDIA_IDENTITY_DATASET
output: /work/runs/media-joint
device: cuda
precision: bf16
representation_mode: recurrent
gradient_checkpointing: true
budget_meter: G
budget: 100000
accumulate_events: 32
microbatch_episodes: 1
max_accumulation_windows: 128
max_window_records: 16
max_record_bytes: 16384
scored_decisions: 4
generated_capacity: 512
eval_every: 0
packs: PIN_PACK_ROOT/lock.json
task_recipe: configs/tasks/media-joint.yaml
text_anchors: PIN_TEXT_ANCHORS_JSONL
text_anchor_weight: 0.1
retrieval_sidecar: PIN_QUERY_RETRIEVAL_TEACHER_SIDECAR
retrieval_document_sidecar: PIN_DOCUMENT_RETRIEVAL_TEACHER_SIDECAR
retrieval_memory_recipe: PIN_P1_RETRIEVAL_MEMORY_RECIPE
inner_optimizer: muon
decoupled:
  run_id: PIN_MEDIA_JOINT_RUN_ID
  coordinator_url: https://PIN_COORDINATOR
  workers: 4
  local_steps: 128
  poll_steps: 4
  heartbeat_steps: 8
  io_workers: 4
  timeout_seconds: 120
  max_offline_steps: 512
  wire_dtype: bf16
