# Deterministic procedural omnimodal optimizer integration, not learned media quality.
# First run: python scripts/prepare_omni_pilot.py --output artifacts/omni-pilot
phase: B0
model: tiny
dataset: artifacts/omni-pilot
codec: byte
output: runs/omni-pilot
device: cpu
precision: fp32
require_blackwell: false
expert_backend: torch
representation_mode: bootstrap
gradient_checkpointing: false
compile: false
budget_meter: G
budget: 28
accumulate_events: 7
microbatch_episodes: 1
max_history_tokens: 512
max_window_records: 8
max_record_bytes: 4096
generated_capacity: 128
scored_decisions: 4
accumulate_scored: 100000
accumulate_ingested: 100000
max_accumulation_windows: 1
max_steps: 2
effort: 1
use_stage_mixture: false
use_effort_mixture: false
allow_byte_codec: true
allow_unverified_data: true
checkpoint_every: 1
eval_every: 0
