# Training methods are defined by the shared curriculum; bind artifacts and compute here.
phase: MB
model: 32x512
codec: PIN_TRAINED_BYTE_CODEC
datasets:
- PIN_PREPARED_TEXT_ROOT
- PIN_PREPARED_MEDIA_IDENTITY_ROOT
output: /work/runs/media-bridge
device: cuda
precision: bf16
gradient_checkpointing: true
accumulate_events: 32
microbatch_episodes: 1
max_accumulation_windows: 128
max_window_records: 16
max_record_bytes: 16384
generated_capacity: 512
eval_windows: 16
packs: PIN_PACK_ROOT/lock.json
text_anchors: PIN_TEXT_ANCHORS_JSONL
decoupled:
  run_id: PIN_MEDIA_BRIDGE_RUN_ID
  coordinator_url: https://PIN_COORDINATOR
  workers: 4
  local_steps: 128
  io_workers: 4
  timeout_seconds: 120
  max_offline_steps: 512
  wire_dtype: bf16
hindsight_targets: /work/data/hindsight
navigation_examples: 8
navigation_negatives: 32
