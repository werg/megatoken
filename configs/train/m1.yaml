# Connected repository / issue / PR / build-log training, with base replay.
phase: M1
model: 32x512
dataset: artifacts/prepared
codec: artifacts/codec
output: runs/m1
device: cuda
precision: bf16
require_blackwell: true
# Production requires the Blackwell parity gate before the budgeted run.
expert_backend: triton
representation_mode: recurrent
gradient_checkpointing: true
compile: false
microbatch_episodes: 4
max_history_tokens: 65536
max_window_records: 16
max_record_bytes: 16384
generated_capacity: 1024
scored_decisions: 8
accumulate_scored: 65536
accumulate_ingested: 1048576
max_accumulation_windows: 256
use_stage_mixture: true
use_effort_mixture: true
checkpoint_every: 100
eval_every: 100
