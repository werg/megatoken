# Task-family sampling probabilities, not equal token/GPU budgets.
omni_recipe_version: concordant-v1
task_weights:
  replay: 0.20
  transcription_and_verbalization: 0.20
  speech_translation: 0.15
  image_description_and_creation: 0.15
  audiovisual_and_endpoints: 0.15
  sequential_editing: 0.15
min_joint_fraction: 0.3333333333
target_multisource_fraction: 0.25
target_counterfactual_fraction: 0.25
media_compute_cap_per_microbatch: 1
source_family_split: true
raw_facets: 32
facet_width: 512
reconstruction_auxiliary: true
pack_manifest_required: true
