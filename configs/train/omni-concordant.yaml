# Native omnimodal training using existing optimizer and grouped meridians.
# Requires immutable prepared family streams and a validated local pack manifest.
phase: B0
model: 32x512
dataset: artifacts/omni-prepared
output: runs/omni-concordant
codec: artifacts/tokenizer
budget_meter: G
budget: 100000
accumulate_events: 32
microbatch_episodes: 1
max_accumulation_windows: 256
max_window_records: 16
scored_decisions: 4
generated_capacity: 512
max_record_bytes: 16384
use_stage_mixture: false
omni_recipe: configs/omni/concordant-v1.yaml
pretrained_packs: artifacts/omni-packs/lock.json
media_root: artifacts/omni-prepared
model_overrides:
  audio_feature_dim: 512
  audio_feature_id: replace-with-pinned-whistle-identity
  vision_feature_dim: 2304
  vision_feature_id: replace-with-pinned-minicpm-identity
  media_feature_views:
    replace-with-pinned-mimi-identity: 32
eval_every: 0
