[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "megatoken"
version = "0.1.0"
description = "Causal faceted sparse models: byte-exact data, training, and generation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26,<3", "PyYAML>=6.0,<7", "jsonschema>=4.23,<5",
    "tree-sitter==0.25.2", "tree-sitter-language-pack==0.13.0",
    "tree-sitter-c-sharp==0.23.5", "tree-sitter-embedded-template==0.25.0",
    "tree-sitter-yaml==0.7.2", "markdown-it-py==4.0.0", "uniseg==0.10.1",
]

[project.optional-dependencies]
train = ["torch>=2.10,<2.15", "safetensors>=0.5,<1"]
coreweave = ["cwsandbox>=1.14.2,<2", "boto3>=1.42.5,<2"]
storage = ["boto3>=1.42.5,<2"]
data = ["tokenizers>=0.21,<1", "regex>=2024.11", "huggingface-hub>=0.28,<2", "pyarrow>=18,<24", "datasets>=3,<5", "zstandard>=0.23,<1"]
dev = ["pytest>=8.3,<9", "ruff>=0.11,<1", "build>=1.2,<2"]
i18n = ["PyICU>=2.16,<3"]
omni-generation = ["diffusers>=0.35,<1", "transformers>=4.57,<6", "accelerate>=1.5,<2", "safetensors>=0.5,<1"]
omni-speech = ["pocket-tts>=0.1", "torchaudio>=2.10,<2.15"]
# The EmbeddingGemma2 media teacher (offline feature caching): its processor
# decodes images (Pillow, torchvision), audio (librosa) and video (torchcodec).
media-teacher = ["transformers>=5.20,<6", "Pillow>=11,<13", "torchvision>=0.25,<0.30", "librosa>=0.10,<1", "torchcodec>=0.10,<0.15"]

[project.scripts]
megatoken = "megatoken.cli:main"
megatoken-memory = "megatoken.memory.recipe:main"
megatoken-memory-supervision = "megatoken.data.retrieval_cli:main"
megatoken-memory-writer = "megatoken.training.writer_cli:main"
megatoken-memory-catalog = "megatoken.memory.catalog_cli:main"
megatoken-memory-reproduce = "megatoken.memory.reproduction_cli:main"
megatoken-memory-index = "megatoken.memory.index_cli:main"
megatoken-memory-centroids = "megatoken.memory.centroids_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/megatoken"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["cuda: requires a CUDA GPU", "distributed: starts multiple processes", "slow: extended integration gate"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
