name: Pinned tracer semantic episode contract

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: semantic-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semantic:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install lightweight megatoken schema and codec
        run: python -m pip install -e . pytest
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: werg/tracing-js-self
          ref: 64442c68fedfceef12c4a21dd1829b67b17a4a1e
          path: tracing-js-self
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Generate pinned owned-interpreter traces
        run: |
          npm ci --prefix tracing-js-self
          node tracing-js-self/tools/generate-witness-v3.mjs \
            --seed 42 --count 8 \
            --output "$RUNNER_TEMP/trace.jsonl" \
            --manifest "$RUNNER_TEMP/manifest.json"
      - name: Import only diagnostic episodes with the explicit byte fallback
        run: |
          python scripts/import_semantic_execution.py \
            --input "$RUNNER_TEMP/trace.jsonl" \
            --output "$RUNNER_TEMP/native.jsonl" \
            --diagnostic-byte --allow-local
      - name: Verify exact target transport and absent predictor oracle
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          from megatoken.data.schema import Episode

          root = Path(os.environ["RUNNER_TEMP"])
          source = [json.loads(s) for s in (root / "trace.jsonl").read_text().splitlines()]
          native = [
              Episode.from_dict(json.loads(s))
              for s in (root / "native.jsonl").read_text().splitlines()
          ]
          manifest = json.loads((root / "manifest.json").read_text())
          assert len(source) == len(native) == manifest["counts"]["locally_verified"] == 8
          assert all(row['public']['schema']=='semantic-execution/3' for row in source)
          assert manifest["counts"]["admitted"] == 0
          for trace, episode in zip(source, native, strict=True):
              expected = [
                  group["events"][0]["record"].encode("utf-8")
                  for group in trace["public"]["groups"]
              ]
              assert [record.payload for record in episode.records] == expected
              assert len(episode.meridians) == len(expected)
              assert episode.supervision.outcome == "unknown"
              assert all(b"referenceStatus" not in payload for payload in expected)
              assert all(b"sidecar" not in payload for payload in expected)
          print("Verified 8 byte-identical causal imports; 0 admitted episodes.")
          PY

      - name: Run semantic importer regression tests
        run: python -m pytest -q tests/test_semantic_execution_v3.py
