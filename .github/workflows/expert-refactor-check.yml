name: Expert refactor validation

on:
  push:
    branches: [work/universal-moe-20261023]

permissions:
  contents: read

concurrency:
  group: expert-refactor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install CPU dependencies
        run: |
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[train,data,cache,storage,dev]'
      - name: Format diagnostics
        run: |
          python -m ruff check --fix src tests scripts || true
          python -m ruff format src tests scripts
          mkdir -p validation
          git diff -- src tests scripts > validation/format.patch
          python - <<'PY'
          import base64
          from pathlib import Path
          print('FORMAT_PATCH_BEGIN')
          print(base64.b64encode(Path('validation/format.patch').read_bytes()).decode())
          print('FORMAT_PATCH_END')
          PY
      - name: Test the reference implementation
        run: python -m pytest -q --maxfail=25 --junitxml=validation/expert-tests.xml
      - name: Keep diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: expert-refactor-diagnostics
          path: validation/
          retention-days: 7
