name: Temporary Python Format Export
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  format-export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate Ruff fixed files for reviewing
        shell: bash
        run: |
          python -m pip install 'ruff==0.17.1'
          python -m ruff check --fix src tests scripts || true
          python -m ruff format src tests scripts
          python - <<'PY'
          import base64
          import subprocess
          from pathlib import Path
          names = subprocess.check_output(['git','diff','--name-only'], text=True).splitlines()
          for path in sorted(names):
              if not path.endswith('.py'):
                  continue
              data = base64.b64encode(Path(path).read_bytes()).decode('ascii')
              print('FMT_FILE_START:' + path)
              for at in range(0, len(data), 3000):
                  print('FMT_CHUNK:' + data[at:at+3000])
              print('FMT_FILE_END:' + path)
          PY
