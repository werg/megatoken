name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      blackwell:
        description: Run the hardware gate on a provisioned Blackwell runner
        type: boolean
        default: false
      codec_directory:
        description: Optional absolute runner path to the pinned primary codec
        type: string
        default: ""
      compile:
        description: Include tensor operator compilation in hardware measurements
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install the tested CPU reference and project dependencies
        run: |
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[train,data,cache,storage,dev]'
      - name: Lint and validate shell entrypoints
        run: |
          python -m ruff check src tests scripts
          python -m ruff format --check src tests scripts
          bash -n scripts/launch.sh scripts/slurm.sh
      - name: Build and install the distribution under test
        run: |
          python -m build
          python -m pip install --no-deps --force-reinstall dist/megatoken-0.1.0-py3-none-any.whl
      - name: Run the complete CPU suite
        run: python -m pytest -q --junitxml=validation/cpu-tests.xml
      - name: Inspect the installed CLI
        run: |
          megatoken --help
          megatoken doctor
          megatoken chunks coverage --output validation/parser-coverage.json
      - name: Retain tests and package artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cpu-${{ matrix.python }}
          path: |
            validation/cpu-tests.xml
            validation/parser-coverage.json
            dist/*
          retention-days: 14

  i18n:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install optional locale refinement and its native build requirements
        run: |
          sudo apt-get update
          sudo apt-get install --yes libicu-dev pkg-config
          python -m pip install -e '.[dev,i18n]'
      - name: Verify Unicode and real ICU behavior
        run: python -m pytest -q tests/test_chunking_prose.py --junitxml=validation/i18n-tests.xml
      - name: Retain locale-refinement evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: i18n
          path: validation/i18n-tests.xml
          retention-days: 14

  blackwell:
    if: github.event_name == 'workflow_dispatch' && inputs.blackwell
    needs: cpu
    runs-on: [self-hosted, linux, blackwell]
    timeout-minutes: 90
    env:
      CODEC_DIRECTORY: ${{ inputs.codec_directory }}
      VALIDATE_COMPILE: ${{ inputs.compile }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the actual training image
        run: docker build --tag "megatoken-ci:${GITHUB_SHA}" .
      - name: CUDA parity, replay, and measured work
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p validation
          container_args=(--rm --gpus all --ipc=host
            --mount "type=bind,source=${GITHUB_WORKSPACE}/validation,target=/validation")
          gate_args=(--output /validation)
          if [[ -n "$CODEC_DIRECTORY" ]]; then
            [[ "$CODEC_DIRECTORY" = /* && -d "$CODEC_DIRECTORY" ]] || {
              echo "codec_directory must be an existing absolute directory on this runner" >&2
              exit 2
            }
            container_args+=(--mount "type=bind,source=${CODEC_DIRECTORY},target=/codec,readonly")
            gate_args+=(--codec /codec)
          fi
          if [[ "$VALIDATE_COMPILE" == true ]]; then gate_args+=(--compile); fi
          docker run "${container_args[@]}" "megatoken-ci:${GITHUB_SHA}" \
            python scripts/validate_blackwell.py "${gate_args[@]}"
      - name: Retain hardware evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blackwell-${{ github.sha }}
          path: validation/
          retention-days: 30
